<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curved Scroll Gallery | Premium Interactive</title>
    <link rel="stylesheet" href="style.css">
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
</head>
<body>
    <!-- Add this right after <body> -->
    <div class="page-loader"></div>
    
    <!-- Fixed container for the animated gallery -->
    <main class="gallery-container">
        <!-- Cards will be injected here via JS -->
    </main>

    <!-- Progress indicator at the bottom -->
    <div class="progress-wrapper">
        <div class="progress-bar" id="progress-bar">
            <!-- Progress lines will be injected here via JS -->
        </div>
    </div>

    <!-- Invisible spacer to create scrollable area -->
    <div class="scroll-spacer"></div>

    <script src="script.js"></script>
</body>
</html>
