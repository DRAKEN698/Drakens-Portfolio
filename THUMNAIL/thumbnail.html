<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Circular Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Right Layout Toggle Button -->
    <button id="toggle-layout-btn" class="layout-btn">Toggle Layout</button>
    <!-- Main Container -->
    <main class="gallery-container">
        <!-- The items will be injected here via JavaScript -->
        <div id="gallery-ring"></div>

        <!-- Hint Text -->
        <div class="interaction-hint">Select an image</div>
    </main>

    <!-- GSAP for Premium Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
