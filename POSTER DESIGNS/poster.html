<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Canvas Experience | Awwwards Level</title>
    <link rel="stylesheet" href="style.css">

    <!-- GSAP for Cinematic Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
</head>

<body>

    <!-- Cinematic Loader -->
    <div id="loader">
        <div class="loader-counter">0%</div>
        <div class="loader-progress">
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Main Canvas Wrapper -->
    <main class="viewport">
        <!-- Dot Grid Background -->
        <div class="grid-background"></div>

        <!-- Draggable / Zoomable Canvas -->
        <div id="canvas">
            <!-- Images will be dynamically injected here via JS to simulate the scatter -->

            <!-- Specific Recreated Element: The Transform Box -->
            <div class="gallery-item transform-box-element" style="left: 60%; top: 65%; width: 15vw; height: 15vw;"
                data-depth="1.2">
                <div class="transform-grid">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop"
                        alt="Blue Abstract Texture">
                    <div class="t-handle top-left"></div>
                    <div class="t-handle top-right"></div>
                    <div class="t-handle bottom-left"></div>
                    <div class="t-handle bottom-right"></div>
                    <div class="t-box"></div>
                </div>
            </div>
        </div>
    </main>


    <script src="script.js"></script>

</body>

</html>
