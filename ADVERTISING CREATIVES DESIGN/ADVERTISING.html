<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Layout Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">
        <!-- UI Overlay -->
        <header class="header">
            <div class="brand">SELECTED WORKS</div>
            <nav class="nav-controls">
                <button class="nav-btn" data-mode="flat">Flat</button>
                <button class="nav-btn" data-mode="tilt">Tilt</button>
                <button class="nav-btn active" data-mode="ring">Ring</button>
                <button class="nav-btn" data-mode="gallery">Gallery</button>
            </nav>
            <div class="header-spacer"></div>
        </header>

        <!-- 3D Stage -->
        <section class="stage">
            <div class="scene" id="scene">
                <!-- Cards injected via JS -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-left">SCROLL TO EXPLORE</div>
            <div class="footer-right" id="counter">01 — 18</div>
        </footer>
    </main>

    <!-- GSAP for state transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
