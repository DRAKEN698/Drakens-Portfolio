<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertising Creatives | Drakens Portfolio</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Minimal Top Header (Matching Reference Design) -->
    <header class="editorial-header" id="editorial-header">
        <a href="../index.html#packaging" class="editorial-brand">DRAKENS</a>
        
        <nav class="editorial-nav" aria-label="Main Navigation">
            <a href="../index.html" class="editorial-nav-link">HOME</a>
            <a href="../index.html#packaging" class="editorial-nav-link">&larr; PORTFOLIO</a>
            <div class="editorial-nav-indicator" id="nav-section-indicator">01 / 05</div>
        </nav>
    </header>

    <!-- Side Section Progress Dots (Click to jump to any section) -->
    <aside class="side-progress-nav" id="side-progress-nav" aria-label="Section Selector">
        <button class="progress-dot active" data-index="0" title="01 Product Advertising">
            <span class="dot-num">01</span>
            <span class="dot-label">Product Ads</span>
        </button>
        <button class="progress-dot" data-index="1" title="02 Promotional & Offer Ads">
            <span class="dot-num">02</span>
            <span class="dot-label">Promo Ads</span>
        </button>
        <button class="progress-dot" data-index="2" title="03 Service & Business Ads">
            <span class="dot-num">03</span>
            <span class="dot-label">Service Ads</span>
        </button>
        <button class="progress-dot" data-index="3" title="04 Performance Marketing">
            <span class="dot-num">04</span>
            <span class="dot-label">Performance</span>
        </button>
        <button class="progress-dot" data-index="4" title="05 Ad Formats & Campaigns">
            <span class="dot-num">05</span>
            <span class="dot-label">Campaigns</span>
        </button>
    </aside>

    <!-- Fullscreen Section-by-Section Scroll Container -->
    <main class="snap-container" id="snap-container">

        <!-- ==========================================
             SECTION 01: PRODUCT ADVERTISING
             ========================================== -->
        <section class="snap-section" id="section-01" data-index="0">
            <div class="section-content-wrap">
                <!-- Horizontal Cards Row -->
                <div class="carousel-container">
                    <div class="cards-track" id="track-01">
                        <!-- Populated dynamically by script.js -->
                    </div>
                    <!-- Circular Navigation Arrows (Matching Reference Screenshot) -->
                    <div class="carousel-arrow-controls">
                        <button class="circle-nav-arrow track-prev" data-target="track-01" aria-label="Previous card">&larr;</button>
                        <button class="circle-nav-arrow track-next" data-target="track-01" aria-label="Next card">&rarr;</button>
                    </div>
                </div>

                <!-- Big Section Title at Bottom (Number on Left, Title on Right) -->
                <div class="section-big-footer">
                    <div class="big-num">01</div>
                    <div class="big-title">PRODUCT ADVERTISING</div>
                </div>
            </div>
        </section>

        <!-- ==========================================
             SECTION 02: PROMOTIONAL & OFFER ADS
             ========================================== -->
        <section class="snap-section" id="section-02" data-index="1">
            <div class="section-content-wrap">
                <!-- Horizontal Cards Row -->
                <div class="carousel-container">
                    <div class="cards-track" id="track-02">
                        <!-- Populated dynamically by script.js -->
                    </div>
                    <!-- Circular Navigation Arrows -->
                    <div class="carousel-arrow-controls">
                        <button class="circle-nav-arrow track-prev" data-target="track-02" aria-label="Previous card">&larr;</button>
                        <button class="circle-nav-arrow track-next" data-target="track-02" aria-label="Next card">&rarr;</button>
                    </div>
                </div>

                <!-- Big Section Title at Bottom (Number on Left, Title on Right) -->
                <div class="section-big-footer">
                    <div class="big-num">02</div>
                    <div class="big-title">PROMOTIONAL &amp; OFFER ADS</div>
                </div>
            </div>
        </section>

        <!-- ==========================================
             SECTION 03: SERVICE & BUSINESS ADS
             ========================================== -->
        <section class="snap-section" id="section-03" data-index="2">
            <div class="section-content-wrap">
                <!-- Horizontal Cards Row -->
                <div class="carousel-container">
                    <div class="cards-track" id="track-03">
                        <!-- Populated dynamically by script.js -->
                    </div>
                    <!-- Circular Navigation Arrows -->
                    <div class="carousel-arrow-controls">
                        <button class="circle-nav-arrow track-prev" data-target="track-03" aria-label="Previous card">&larr;</button>
                        <button class="circle-nav-arrow track-next" data-target="track-03" aria-label="Next card">&rarr;</button>
                    </div>
                </div>

                <!-- Big Section Title at Bottom (Number on Left, Title on Right) -->
                <div class="section-big-footer">
                    <div class="big-num">03</div>
                    <div class="big-title">SERVICE &amp; BUSINESS ADS</div>
                </div>
            </div>
        </section>

        <!-- ==========================================
             SECTION 04: PERFORMANCE MARKETING
             ========================================== -->
        <section class="snap-section" id="section-04" data-index="3">
            <div class="section-content-wrap">
                <!-- Horizontal Cards Row -->
                <div class="carousel-container">
                    <div class="cards-track" id="track-04">
                        <!-- Populated dynamically by script.js -->
                    </div>
                    <!-- Circular Navigation Arrows -->
                    <div class="carousel-arrow-controls">
                        <button class="circle-nav-arrow track-prev" data-target="track-04" aria-label="Previous card">&larr;</button>
                        <button class="circle-nav-arrow track-next" data-target="track-04" aria-label="Next card">&rarr;</button>
                    </div>
                </div>

                <!-- Big Section Title at Bottom (Number on Left, Title on Right) -->
                <div class="section-big-footer">
                    <div class="big-num">04</div>
                    <div class="big-title">PERFORMANCE MARKETING</div>
                </div>
            </div>
        </section>

        <!-- ==========================================
             SECTION 05: AD FORMATS & CAMPAIGNS
             ========================================== -->
        <section class="snap-section" id="section-05" data-index="4">
            <div class="section-content-wrap">
                <!-- Horizontal Cards Row -->
                <div class="carousel-container">
                    <div class="cards-track" id="track-05">
                        <!-- Populated dynamically by script.js -->
                    </div>
                    <!-- Circular Navigation Arrows -->
                    <div class="carousel-arrow-controls">
                        <button class="circle-nav-arrow track-prev" data-target="track-05" aria-label="Previous card">&larr;</button>
                        <button class="circle-nav-arrow track-next" data-target="track-05" aria-label="Next card">&rarr;</button>
                    </div>
                </div>

                <!-- Big Section Title at Bottom (Number on Left, Title on Right) -->
                <div class="section-big-footer">
                    <div class="big-num">05</div>
                    <div class="big-title-group">
                        <div class="big-title">AD FORMATS &amp; CAMPAIGNS</div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Multi-Image Modal Carousel (Clean, Zero Profile Header) -->
    <div class="ig-modal" id="ig-modal" aria-hidden="true" role="dialog">
        <div class="ig-modal-backdrop" id="ig-modal-backdrop"></div>
        <div class="ig-modal-box">
            
            <!-- Modal Header: Only Slide Counter & Close Button -->
            <div class="ig-modal-header">
                <div class="ig-counter-badge" id="modal-counter">1 / 3</div>
                <button class="ig-close-btn" id="modal-close-btn" aria-label="Close modal">&times;</button>
            </div>

            <!-- Modal Image Slider Area -->
            <div class="ig-slider-area" id="ig-slider-area">
                <button class="ig-nav-arrow ig-arrow-prev" id="modal-prev-btn" aria-label="Previous slide">&#8249;</button>

                <div class="ig-image-stage">
                    <img src="" alt="" id="modal-slide-img" class="ig-slide-img">
                </div>

                <button class="ig-nav-arrow ig-arrow-next" id="modal-next-btn" aria-label="Next slide">&#8250;</button>

                <!-- Dots Pagination -->
                <div class="ig-dots-container" id="modal-dots-container"></div>
            </div>

            <!-- Modal Footer / Captions & Thumbnails -->
            <div class="ig-modal-footer">
                <div class="ig-caption-block">
                    <h3 class="ig-caption-title" id="modal-title">Creative Title</h3>
                    <p class="ig-caption-desc" id="modal-caption">Slide 1 of 3</p>
                </div>

                <!-- Thumbnail Navigation Strip -->
                <div class="ig-thumb-tray" id="modal-thumb-tray"></div>
            </div>

        </div>
    </div>

    <!-- Pure Vanilla JS -->
    <script src="script.js"></script>
</body>

</html>
