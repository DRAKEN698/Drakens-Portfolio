<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertising Gallery | Drakens</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Content Layout -->
    <main class="gallery-wrapper">

        <!-- Horizontal Image Grid / Carousel -->
        <div class="carousel-container" id="carousel-track">
            <!-- Sections will be injected here via JavaScript -->
        </div>

        <!-- Arrow Controls -->
        <div class="carousel-controls">
            <button class="arrow-btn" id="prev-btn" aria-label="Previous">&larr;</button>
            <button class="arrow-btn" id="next-btn" aria-label="Next">&rarr;</button>
        </div>

        <!-- Bottom Large Text Section -->
        <div class="bottom-footer">
            <div class="footer-line"></div>
            <div class="footer-content">
                <div class="big-number">01</div>
                <div class="big-title">ADVERTISING</div>
            </div>
        </div>

    </main>

    <!-- HIDDEN GRID MODAL (Pops up when a section is clicked) -->
    <div class="grid-modal" id="grid-modal">
        <div class="modal-header">
            <div class="modal-title" id="modal-title">CATEGORY NAME</div>
            <button class="close-btn" id="close-modal-btn">&times;</button>
        </div>
        <!-- Inner images will be loaded here in a CSS Grid -->
        <div class="modal-grid-content" id="modal-grid-content">
            <!-- Images generated by JS -->
        </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>

</html>
